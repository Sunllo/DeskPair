// Sunllo DeskPair peer-to-peer session protocol (controller <-> host).
// Every frame on a peer stream is one Message. The two hello messages are
// plaintext; everything after key derivation is AES-256-GCM encrypted.
syntax = "proto3";

package sunllo.messages;

import "sunllo/rendezvous.proto";

option csharp_namespace = "DeskPair.Protocol.Messages";

// ---- handshake (plaintext) ----

message ControllerHello {
  uint32 protocol_version = 1;  // the newest this side speaks (= max_protocol_version); kept for protocol-1 hosts
  bytes ephemeral_pk = 2;      // SPKI DER, ECDH P-256
  bytes nonce = 3;             // 32 random bytes
  string version = 4;
  // The range this side speaks. Protocol 1 sent neither, and a host treats their absence as [1, 1].
  // The host picks the highest version both ranges contain, or refuses with HostHello.refusal.
  uint32 min_protocol_version = 5;
  uint32 max_protocol_version = 6;
}

message HostHello {
  uint32 protocol_version = 1;  // the version chosen for this session (or, on refusal, the host's newest)
  string id = 2;
  bytes identity_pk = 3;       // SPKI DER, ECDSA P-256
  bytes ephemeral_pk = 4;
  bytes nonce = 5;
  bytes signature = 6;         // ECDSA over the handshake transcript
  string version = 7;
  uint32 min_protocol_version = 8;
  uint32 max_protocol_version = 9;
  // Set instead of a signed hello when no common version exists: says which side has to update. A
  // protocol-1 controller never reads it, but does show "unsupported protocol version 2", which is the
  // same instruction in fewer words.
  string refusal = 10;
}

// ---- authentication (encrypted from here on) ----

enum ApproveMode {
  APPROVE_PASSWORD = 0;
  APPROVE_CLICK = 1;
  APPROVE_BOTH = 2;
}

// How the host derives h1 from a password; the controller must derive it the same way.
enum PasswordKdf {
  KDF_SHA256 = 0;         // h1 = SHA256(pw || salt); protocol 1, and hosts whose permanent password predates protocol 2
  KDF_PBKDF2_SHA256 = 1;  // h1 = PBKDF2-HMAC-SHA256(pw, salt, kdf_iterations, 32)
}

message AuthChallenge {
  bytes salt = 1;
  bytes challenge = 2;
  ApproveMode approve_mode = 3;
  bool requires_totp = 4;
  PasswordKdf kdf = 5;
  uint32 kdf_iterations = 6;   // meaningful for KDF_PBKDF2_SHA256; 0 otherwise
}

message LoginRequest {
  bytes password_proof = 1;    // SHA256(h1 || challenge) with h1 per AuthChallenge.kdf; empty in click-only mode
  string my_id = 2;
  string my_name = 3;
  string my_platform = 4;
  bytes hwid = 5;
  sunllo.rendezvous.ConnType conn_type = 6;
  SessionOptions options = 7;
  string version = 8;
  uint64 session_id = 9;
  string totp_code = 10;
  MediaCapabilities media = 11;   // what the controller can receive outside the TCP stream
}

// ---- UDP media channel (video over datagrams with FEC; everything else stays on TCP) ----

message MediaCapabilities {
  bool udp = 1;                   // controller can receive media over UDP
  uint32 max_datagram = 2;        // bytes, 1200
  uint32 fec_version = 3;         // 1 = Reed-Solomon GF(256) as described in docs/architecture.md
}

message MediaCandidate {
  enum Kind {
    LOCAL = 0;
    REFLEXIVE = 1;
    RELAY = 2;
  }
  sunllo.rendezvous.SocketAddress addr = 1;
  Kind kind = 2;
  uint32 priority = 3;
}

message MediaChannelOffer {          // host -> controller
  uint32 channel_id = 1;
  repeated MediaCandidate candidates = 2;
  string relay_server = 3;           // host:port; UDP relay on the same port number; empty = none
  bytes relay_token = 4;             // 16 bytes both sides present to the relay: derived from relay_ticket when there is one
  uint32 timeout_ms = 5;
  sunllo.rendezvous.NatType host_nat = 6;
  uint32 keepalive_ms = 7;
  // The rendezvous server's permission to use its relay, which the relay checks on the UDP bind as well
  // as on the TCP request. The host holds one from the signalling exchange and hands it to the
  // controller here, so a session that went peer to peer and only falls back to the relay for media
  // still has it.
  sunllo.rendezvous.RelayTicket relay_ticket = 8;
}

message MediaChannelAnswer {         // controller -> host
  uint32 channel_id = 1;
  bool accept = 2;
  repeated MediaCandidate candidates = 3;
  sunllo.rendezvous.NatType controller_nat = 4;
}

message MediaChannelReady {          // either side once its path is verified
  uint32 channel_id = 1;
  MediaCandidate.Kind path = 2;
  sunllo.rendezvous.SocketAddress remote = 3;
}

message MediaChannelClose {          // either side: back to TCP
  uint32 channel_id = 1;
  string reason = 2;
}

message LoginError {
  enum Code {
    UNKNOWN = 0;
    WRONG_PASSWORD = 1;
    TOO_MANY_ATTEMPTS = 2;
    REJECTED_BY_USER = 3;
    APPROVAL_TIMEOUT = 4;
    NO_PERMISSION = 5;
    TOTP_REQUIRED = 6;
    WRONG_TOTP = 7;
    OFFLINE = 8;
    BUSY = 9;
    VERSION_MISMATCH = 10;
  }
  Code code = 1;
  string message = 2;
  uint32 retry_after_ms = 3;
}

message LoginResponse {
  oneof union {
    LoginError error = 1;
    PeerInfo peer_info = 2;
  }
  bool waiting_for_approval = 3;
}

// A size a display can be set to, in the pixels that get streamed. scale is the backing factor
// (2 on a Retina "HiDPI" mode, 0 where the platform has no such thing): two modes with the same
// pixel size and different scales are different modes on macOS, so the triple is the key.
message Resolution {
  int32 width = 1;
  int32 height = 2;
  double scale = 3;
}

// Every width and height from min to max that is a multiple of step.
message SizeRange {
  int32 min_width = 1;
  int32 min_height = 2;
  int32 max_width = 3;
  int32 max_height = 4;
  int32 step = 5;
}

message DisplayInfo {
  int32 x = 1;
  int32 y = 2;
  int32 width = 3;
  int32 height = 4;
  string name = 5;
  bool online = 6;
  bool primary = 7;
  double scale = 8;
  repeated Resolution modes = 9;   // sizes this display can be switched to, largest first; empty = not from here
  Resolution original = 10;        // set only while a viewer-chosen mode is in force: what "original" restores
  bool virtual_display = 11;       // plugged in by the host at a viewer's request; one it can take away again
  // Set when the host can make up a mode of any size in this range for the display, so a viewer may ask for
  // exactly the size of its window rather than the nearest of modes. Unset: modes is the whole choice.
  SizeRange any_size = 12;
  // The host's private session screen: while it is up, the only display on, sized by the viewers' windows.
  bool session_screen = 13;
}

// Controller -> host: switch a display to one of the modes it advertised, or back to its original
// (resolution unset). Refused without keyboard permission, and for a size not in the list -- unless the
// display offers any_size and the size lies in it.
message DisplayResolution {
  int32 display = 1;
  Resolution resolution = 2;
}

// Host -> every controller after a mode change, so each one's picker tells the truth; the requester
// alone gets a copy with failure set when its request was refused.
//
// notice is the host speaking for itself rather than answering a request: why its displays are what
// they are right now -- waiting for the person at the machine to allow screen sharing, sharing refused
// or stopped there, nothing on this machine able to share a Wayland screen. The list comes with it and
// is taken as it is; an empty notice clears the last one. A controller that predates it sees an ordinary
// change of list.
message DisplaysChanged {
  repeated DisplayInfo displays = 1;
  int32 current_display = 2;
  int32 changed = 3;
  string failure = 4;
  string notice = 5;
}

message SupportedEncoding {
  bool h264 = 1;
  bool h265 = 2;
  bool vp8 = 3;
  bool vp9 = 4;
  bool av1 = 5;
}

message PeerInfo {
  string username = 1;
  string hostname = 2;
  string platform = 3;
  repeated DisplayInfo displays = 4;
  int32 current_display = 5;
  string version = 6;
  SupportedEncoding encoding = 7;
  repeated Permission granted = 8;
  // The host understands display_subscription: a viewer may watch several of its displays at once.
  // An older host never sets it, and ignores the message it does not know.
  bool multi_display = 9;
}

// ---- video ----

enum VideoCodec {
  VC_VP8 = 0;
  VC_VP9 = 1;
  VC_H264 = 2;
  VC_H265 = 3;
  VC_AV1 = 4;
}

message EncodedVideoFrame {
  bytes data = 1;
  bool key = 2;
  int64 pts_ms = 3;
  uint32 seq = 4;
}

message VideoFrame {
  VideoCodec codec = 1;
  int32 display = 2;
  EncodedVideoFrame frame = 3;
  uint32 width = 4;
  uint32 height = 5;
}

message VideoAck {
  int32 display = 1;
  uint32 seq = 2;
}

message RefreshVideo {
  int32 display = 1;
}

message SwitchDisplay {
  int32 display = 1;
}

// Controller -> host: plug in a display that does not exist, or unplug one that was plugged in that way.
// Refused without keyboard permission (someone who may only watch must not reshape the desk) and unless
// the host's owner allowed it. The answer is displays_changed: the new list to everyone, the new display
// marked virtual_display, or failure to the asker alone -- the same answer a resolution change gets.
message VirtualDisplayRequest {
  enum Action {
    VD_ADD = 0;
    VD_REMOVE = 1;
  }
  Action action = 1;
  Resolution resolution = 2;  // VD_ADD: the size to start at; unset leaves it to the host
  int32 display = 3;          // VD_REMOVE: which display
  // VD_ADD: other sizes this viewer expects to ask the display for later -- its screens and their work areas. A host
  // whose added displays can take only the sizes they were plugged in with (Windows) plugs it in with these too.
  repeated Resolution sizes = 4;
}

// Controller -> host: every display this viewer wants streamed, and the one with its attention (it gets
// the larger share of the bitrate). Always the whole set, never a difference: each one sent is a fresh
// agreement, where a difference that goes missing or arrives twice leaves the two ends disagreeing for
// good. Host -> controller: the set now streamed, or the set kept and why (failure) when it refused.
// A host sends one only to a viewer that has sent one, and confirms the focus with switch_display to
// everyone, so a viewer that has never heard of this sees nothing new.
message DisplaySubscription {
  repeated int32 displays = 1;
  int32 focus = 2;
  string failure = 3;
  // Host -> controller only: DisplayInfo.name of each entry of displays, in the same order. After a monitor
  // is pulled the indices move and the new display list may not have arrived yet; the names let a viewer
  // match its windows to displays without depending on which of the two messages it reads first.
  repeated string names = 4;
}

enum ImageQuality {
  IQ_BALANCED = 0;
  IQ_LOW = 1;
  IQ_BEST = 2;
  IQ_CUSTOM = 3;
}

message SupportedDecoding {
  bool h264 = 1;
  bool h265 = 2;
  bool vp8 = 3;
  bool vp9 = 4;
  bool av1 = 5;
  VideoCodec prefer = 6;
  bool tiles = 7;              // understands TileUpdate (lossless tile patches)
}

// ---- input ----

// mask: low 3 bits = action (0 move, 1 down, 2 up, 3 wheel, 4 trackpad,
// 5 move_relative); bits 3.. = button flags (left 0x01, right 0x02,
// middle 0x04, back 0x08, forward 0x10) shifted left by 3.
message MouseEvent {
  int32 mask = 1;
  int32 x = 2;
  int32 y = 3;
  repeated ControlKey modifiers = 4;
  int32 display = 5;
  // The size of the picture x and y are pixels of. The display may have changed size since that picture was
  // taken -- a new resolution is on its way to the viewer -- and the host scales the point onto the size it
  // has now. Unset (an older viewer): x and y are taken as they are.
  int32 frame_width = 6;
  int32 frame_height = 7;
}

enum KeyboardMode {
  KM_MAP = 0;        // positional: chr carries a platform scancode / keycode
  KM_TRANSLATE = 1;  // semantic: unicode / seq reproduced on the host layout
}

enum ControlKey {
  CK_UNKNOWN = 0;
  CK_ALT = 1;
  CK_BACKSPACE = 2;
  CK_CAPS_LOCK = 3;
  CK_CONTROL = 4;
  CK_DELETE = 5;
  CK_DOWN_ARROW = 6;
  CK_END = 7;
  CK_ESCAPE = 8;
  CK_F1 = 9;
  CK_F10 = 10;
  CK_F11 = 11;
  CK_F12 = 12;
  CK_F2 = 13;
  CK_F3 = 14;
  CK_F4 = 15;
  CK_F5 = 16;
  CK_F6 = 17;
  CK_F7 = 18;
  CK_F8 = 19;
  CK_F9 = 20;
  CK_HOME = 21;
  CK_LEFT_ARROW = 22;
  CK_META = 23;
  CK_OPTION = 24;
  CK_PAGE_DOWN = 25;
  CK_PAGE_UP = 26;
  CK_RETURN = 27;
  CK_RIGHT_ARROW = 28;
  CK_SHIFT = 29;
  CK_SPACE = 30;
  CK_TAB = 31;
  CK_UP_ARROW = 32;
  CK_NUMPAD0 = 33;
  CK_NUMPAD1 = 34;
  CK_NUMPAD2 = 35;
  CK_NUMPAD3 = 36;
  CK_NUMPAD4 = 37;
  CK_NUMPAD5 = 38;
  CK_NUMPAD6 = 39;
  CK_NUMPAD7 = 40;
  CK_NUMPAD8 = 41;
  CK_NUMPAD9 = 42;
  CK_CANCEL = 43;
  CK_CLEAR = 44;
  CK_MENU = 45;
  CK_PAUSE = 46;
  CK_KANA = 47;
  CK_HANGUL = 48;
  CK_JUNJA = 49;
  CK_FINAL = 50;
  CK_HANJA = 51;
  CK_KANJI = 52;
  CK_CONVERT = 53;
  CK_SELECT = 54;
  CK_PRINT = 55;
  CK_EXECUTE = 56;
  CK_SNAPSHOT = 57;
  CK_INSERT = 58;
  CK_HELP = 59;
  CK_SLEEP = 60;
  CK_SEPARATOR = 61;
  CK_SCROLL = 62;
  CK_NUM_LOCK = 63;
  CK_RWIN = 64;
  CK_APPS = 65;
  CK_MULTIPLY = 66;
  CK_ADD = 67;
  CK_SUBTRACT = 68;
  CK_DECIMAL = 69;
  CK_DIVIDE = 70;
  CK_EQUALS = 71;
  CK_NUMPAD_ENTER = 72;
  CK_RSHIFT = 73;
  CK_RCONTROL = 74;
  CK_RALT = 75;
  CK_VOLUME_MUTE = 76;
  CK_VOLUME_UP = 77;
  CK_VOLUME_DOWN = 78;
  CK_POWER = 79;
  CK_CTRL_ALT_DEL = 100;
  CK_LOCK_SCREEN = 101;
}

message KeyEvent {
  bool down = 1;
  bool press = 2;
  oneof union {
    ControlKey control_key = 3;
    uint32 chr = 4;
    uint32 unicode = 5;
    string seq = 6;
  }
  repeated ControlKey modifiers = 7;
  KeyboardMode mode = 8;
}

// ---- cursor ----

message CursorData {
  uint64 id = 1;
  int32 hotx = 2;
  int32 hoty = 3;
  int32 width = 4;
  int32 height = 5;
  bytes bgra = 6;
}

message CursorPosition {
  int32 x = 1;
  int32 y = 2;
  int32 display = 3;
}

message CursorId {
  uint64 id = 1;
}

// ---- audio ----

message AudioFormat {
  uint32 sample_rate = 1;
  uint32 channels = 2;
}

message AudioFrame {
  bytes opus = 1;
  int64 pts_ms = 2;
}

// ---- clipboard / chat ----

enum ClipboardFormat {
  CF_TEXT = 0;
  CF_HTML = 1;
  CF_RTF = 2;
  CF_IMAGE_PNG = 3;
  // Not content but a promise: the payload is a serialised ClipboardFileListing and the bytes are fetched
  // over the existing file transfer channel when the other side pastes.
  CF_FILE_LIST = 4;
}

// One file offered by a copy. Addressed by id rather than by position, because a second copy while the first
// is still being pasted would shift every index under the reader.
message ClipboardFileEntry {
  int64 id = 1;
  // Relative to the listing's root, '/'-separated. Validated against traversal before it is ever used.
  string relative_path = 2;
  uint64 size = 3;
  int64 modified_unix_ms = 4;
  // A directory contributes one entry and is expanded with ReadAllFiles at paste time, not at copy time.
  bool is_directory = 5;
}

// The payload of a CF_FILE_LIST clipboard item: what was copied, not the bytes of it.
message ClipboardFileListing {
  // Identifies this promise, so a staging directory left behind can be traced to the copy that made it.
  string token = 1;
  // The directory on the copying machine that relative_path is relative to.
  string root = 2;
  repeated ClipboardFileEntry entries = 3;
}

message Clipboard {
  ClipboardFormat format = 1;
  bytes content = 2;
  bool compressed = 3;
  uint32 width = 4;
  uint32 height = 5;
}

message MultiClipboards {
  repeated Clipboard items = 1;
  bytes content_hash = 2;
}

message ChatMessage {
  string text = 1;
  int64 sent_at_ms = 2;
}

// ---- file transfer ----

enum FileType {
  FT_DIR = 0;
  FT_FILE = 1;
  FT_SYMLINK = 2;
}

message FileEntry {
  FileType type = 1;
  string name = 2;
  uint64 size = 3;
  uint64 modified_unix = 4;
}

message FileDirectory {
  int32 id = 1;
  string path = 2;
  repeated FileEntry entries = 3;
}

message ReadDir {
  int32 id = 1;
  string path = 2;
  bool include_hidden = 3;
}

message ReadAllFiles {
  int32 id = 1;
  string path = 2;
  bool include_hidden = 3;
}

// Download from the requester's point of view: "please send me <path>".
message FileTransferSendRequest {
  int32 id = 1;
  string path = 2;
  bool include_hidden = 3;
  int32 file_num = 4;
}

// Upload: "I will send you these files into <path>".
message FileTransferReceiveRequest {
  int32 id = 1;
  string path = 2;
  repeated FileEntry files = 3;
  int32 file_num = 4;
  uint64 total_size = 5;
}

message FileTransferDigest {
  int32 id = 1;
  int32 file_num = 2;
  uint64 last_modified = 3;
  uint64 file_size = 4;
  bool is_upload = 5;
  bool is_identical = 6;
  uint64 transferred_size = 7;
  bool is_resume = 8;
}

message FileTransferSendConfirm {
  int32 id = 1;
  int32 file_num = 2;
  oneof union {
    bool skip = 3;
    uint32 offset_blk = 4;
  }
}

message FileTransferBlock {
  int32 id = 1;
  int32 file_num = 2;
  uint32 blk_id = 3;
  bytes data = 4;
  bool compressed = 5;
}

message FileTransferDone {
  int32 id = 1;
  int32 file_num = 2;
}

message FileTransferError {
  int32 id = 1;
  int32 file_num = 2;
  string error = 3;
}

message FileTransferCancel {
  int32 id = 1;
}

message FileDirCreate {
  int32 id = 1;
  string path = 2;
}

message FileRemoveDir {
  int32 id = 1;
  string path = 2;
  bool recursive = 3;
}

message FileRemoveFile {
  int32 id = 1;
  string path = 2;
  int32 file_num = 3;
}

message FileRename {
  int32 id = 1;
  string path = 2;
  string new_name = 3;
}

message FileAction {
  oneof union {
    ReadDir read_dir = 1;
    ReadAllFiles all_files = 2;
    FileTransferSendRequest send = 3;
    FileTransferReceiveRequest receive = 4;
    FileDirCreate create = 5;
    FileRemoveDir remove_dir = 6;
    FileRemoveFile remove_file = 7;
    FileRename rename = 8;
    FileTransferCancel cancel = 9;
    FileTransferSendConfirm send_confirm = 10;
  }
}

message FileResponse {
  oneof union {
    FileDirectory dir = 1;
    FileTransferBlock block = 2;
    FileTransferError error = 3;
    FileTransferDone done = 4;
    FileTransferDigest digest = 5;
  }
}

// ---- terminal ----
// A shell on the host behind a pseudo-terminal. Ids are chosen by the controller, as for file transfer.
// Data is bytes, never string: a pty splits UTF-8 anywhere and shells emit sequences that are not UTF-8.
// TerminalOpen names no program, arguments, directory or environment: the host decides all of that,
// because on Linux the request crosses into a root process, and "a shell as this identity" is bounded
// where "run this string as root" is not.

message TerminalOpen {
  int32 id = 1;
  uint32 columns = 2;
  uint32 rows = 3;
}

message TerminalOpened {
  int32 id = 1;
  string identity = 2;   // the account the shell runs as, in words: "root", "NT AUTHORITY\SYSTEM", "alice"
  string shell = 3;
}

message TerminalInput {
  int32 id = 1;
  bytes data = 2;
}

message TerminalOutput {
  int32 id = 1;
  bytes data = 2;
}

// Output the controller has consumed; the host keeps at most a window of unacknowledged bytes in flight.
message TerminalAck {
  int32 id = 1;
  uint32 bytes = 2;
}

message TerminalResize {
  int32 id = 1;
  uint32 columns = 2;
  uint32 rows = 3;
}

message TerminalSignal {
  enum Kind {
    INTERRUPT = 0;
    TERMINATE = 1;
    KILL = 2;
    HANGUP = 3;
  }
  int32 id = 1;
  Kind signal = 2;
}

message TerminalClose {
  int32 id = 1;
}

message TerminalExit {
  int32 id = 1;
  int32 code = 2;
  string reason = 3;
}

message TerminalError {
  int32 id = 1;
  string message = 2;
}

// controller -> host
message TerminalAction {
  oneof union {
    TerminalOpen open = 1;
    TerminalInput input = 2;
    TerminalResize resize = 3;
    TerminalSignal signal = 4;
    TerminalClose close = 5;
    TerminalAck ack = 6;
  }
}

// host -> controller
message TerminalResponse {
  oneof union {
    TerminalOpened opened = 1;
    TerminalOutput output = 2;
    TerminalExit exit = 3;
    TerminalError error = 4;
  }
}

// ---- control ----

enum Permission {
  PERM_KEYBOARD = 0;
  PERM_CLIPBOARD = 1;
  PERM_AUDIO = 2;
  PERM_FILE = 3;
  PERM_RESTART = 4;
  PERM_TERMINAL = 5;   // a shell on the host; off by default, never requested by SessionOptions
}

message PermissionInfo {
  Permission permission = 1;
  bool enabled = 2;
}

enum BoolOption {
  BO_NOT_SET = 0;
  BO_NO = 1;
  BO_YES = 2;
}

message SessionOptions {
  ImageQuality image_quality = 1;
  int32 custom_bitrate_kbps = 2;
  int32 custom_fps = 3;
  BoolOption show_remote_cursor = 4;
  BoolOption disable_audio = 5;
  BoolOption disable_clipboard = 6;
  BoolOption disable_keyboard = 7;
  BoolOption lock_after_session_end = 8;
  SupportedDecoding supported_decoding = 9;
  BoolOption lossless_refinement = 10;   // default (not set) = on
  // The viewer gives the host's screen the size of its window ("Match window"). A host whose owner allows a private
  // session screen then plugs in a display of the window's size -- viewport, in the display's pixels -- able to take
  // the viewer's screens' sizes too, and turns every other display off while viewers follow their windows. An older
  // host ignores all three.
  BoolOption follow_window = 11;
  Resolution viewport = 12;
  repeated Resolution screens = 13;
}

// ---- lossless tiles (RDP-GFX style progressive refinement) ----

enum TileCodec {
  TC_BGR_DELTA_BROTLI = 0;     // B/G/R planes, left-delta filtered, Brotli
}

message Tile {
  uint32 col = 1;
  uint32 row = 2;
  uint32 w = 3;
  uint32 h = 4;
  bytes data = 5;
}

// A batch of lossless tiles patched onto the viewer's current picture of `display`.
// `seq` shares the VideoFrame sequence space so VideoAck applies unchanged.
message TileUpdate {
  int32 display = 1;
  uint32 seq = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 tile_size = 5;
  TileCodec codec = 6;
  repeated Tile tiles = 7;
  bool refinement = 8;         // true: background refinement of previously lossy tiles
  uint32 pass = 9;             // refinement round; the viewer presents a round as one picture
  bool pass_complete = 10;     // last batch of the round
}

message TestDelay {
  int64 time_ms = 1;
  bool from_controller = 2;
  uint32 last_delay_ms = 3;
  uint32 target_bitrate_kbps = 4;
}

message CloseReason {
  string reason = 1;
}

message MessageBox {
  string kind = 1;
  string title = 2;
  string text = 3;
}

message Misc {
  oneof union {
    ChatMessage chat = 1;
    SwitchDisplay switch_display = 2;
    PermissionInfo permission_info = 3;
    SessionOptions options = 4;
    AudioFormat audio_format = 5;
    CloseReason close_reason = 6;
    RefreshVideo refresh_video = 7;
    VideoAck video_ack = 8;
    bool restart_remote_device = 9;
    SupportedEncoding supported_encoding = 10;
    MessageBox message_box = 11;
    MediaChannelOffer media_offer = 12;
    MediaChannelAnswer media_answer = 13;
    MediaChannelReady media_ready = 14;
